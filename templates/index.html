<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCMT Precision Counselor 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'SF Pro Display', -apple-system, sans-serif; letter-spacing: -0.01em; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .result-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .result-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-[#F5F5F7] text-[#1D1D1F] min-h-screen">

    <nav class="sticky top-0 z-50 glass-card border-b border-gray-200/50 px-6 py-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-semibold tracking-tight">CCMT Counselor <span class="text-indigo-600">2026</span></h1>
            <div class="text-xs font-medium px-3 py-1 bg-gray-100 rounded-full text-gray-500 uppercase tracking-widest">Static Mode</div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6 py-12">
        <div class="text-center mb-12">
            <h2 class="text-4xl font-semibold mb-3 tracking-tight">Find your perfect fit.</h2>
            <p class="text-xl text-gray-500">Based on verified 2025/2024 cutoffs.</p>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] border border-gray-200 shadow-sm mb-12">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold mb-2 ml-1">GATE Score</label>
                    <input type="number" id="gate_score" placeholder="e.g. 550" 
                        class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 ml-1">Data Year</label>
                    <select id="year" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none">
                        <option value="2025">2025 (Latest)</option>
                        <option value="2024">2024</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 ml-1">Category</label>
                    <select id="category" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none">
                        <option value="OPEN">General (OPEN)</option>
                        <option value="OBC-NCL">OBC-NCL</option>
                        <option
